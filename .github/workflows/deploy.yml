# Builds the game and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Pre-baked OSM data (city roads + race lines) is kept between runs, so
      # each deploy only asks the rate-limited public Overpass servers for
      # what's still missing. Bump "osm-v1" to force a full refresh.
      - name: Restore OSM data
        uses: actions/cache/restore@v4
        with:
          path: |
            public/roads
            public/routes
          key: osm-v1-${{ github.run_id }}
          restore-keys: osm-v1-
      # Time-boxed and non-fatal: a rate-limited Overpass never holds up the
      # deploy. Whatever is still missing loads live in the browser and is
      # fetched again on the next deploy.
      - name: Fetch OSM roads and race lines
        run: npm run fetch-roads -- --budget 150 || echo "::warning::Some OSM data could not be pre-fetched; it will load live in the browser"
        timeout-minutes: 5
        continue-on-error: true
      - name: Save OSM data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            public/roads
            public/routes
          key: osm-v1-${{ github.run_id }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
