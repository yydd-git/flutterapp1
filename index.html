<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14181e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Drive classic Indian cars on the real roads of Chhattisgarh. Free, open-source, OpenStreetMap data." />
    <title>Chhattisgarh Road Rally</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="map"></div>
    <canvas id="overlay"></canvas>
    <div id="hud"></div>
    <div id="topbar" hidden></div>
    <div id="touch" hidden></div>
    <div id="menu"></div>
    <div id="rotate-hint">↻ Rotate your phone to landscape for the best view</div>
    <div id="loading"><div class="spinner"></div>Loading Chhattisgarh…</div>
    <noscript>This game needs JavaScript.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
